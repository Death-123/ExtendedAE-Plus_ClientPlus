name: Build CI

on:
  push:
    branches: [ "1.21.1kotlin" ]
  pull_request:
    branches: [ "1.21.1kotlin" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: "!contains(github.event.head_commit.message, 'skip-ci')"

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - name: Make Gradle Executable
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set Build Type
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "BUILD_TYPE=release" >> $GITHUB_ENV
          elif [[ "${{ github.event.head_commit.message }}" == *"build-release"* ]]; then
            echo "BUILD_TYPE=release" >> $GITHUB_ENV
          else
            echo "BUILD_TYPE=snapshot" >> $GITHUB_ENV
          fi

      - name: Build with Gradle
        run: |
          if [[ "${{ github.event.head_commit.message }}" == *"refresh-cache"* ]]; then
            ./gradlew build --no-configuration-cache --refresh-dependencies
          else
            ./gradlew build
          fi


      - name: Get Version
        id: version
        run: |
          MOD_ID=$(grep "^mod_id" gradle.properties | cut -d= -f2 | tr -d ' ')
          MOD_NAME=$(grep "^mod_name" gradle.properties | cut -d= -f2 | tr -d ' ')
          MOD_VERSION=$(grep "^mod_version" gradle.properties | cut -d= -f2 | tr -d ' ')
          echo "mod_id=$MOD_ID" >> $GITHUB_OUTPUT
          echo "mod_name=$MOD_NAME" >> $GITHUB_OUTPUT
          echo "mod_version=$MOD_VERSION" >> $GITHUB_OUTPUT
          echo "artifact_name=${MOD_NAME} ${MOD_VERSION}" >> $GITHUB_OUTPUT

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: "${{ steps.version.outputs.artifact_name }}"
          path: build/libs/*.jar

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ build ]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: "${{ needs.build.outputs.artifact_name }}"
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.jar
          generate_release_notes: true
